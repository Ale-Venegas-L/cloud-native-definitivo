services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://admin:password@mongodb:27017/classic_library?authSource=admin}
      - MONGO_DATABASE=${MONGO_DATABASE:-classic_library}
      - FRONTEND_URL=http://${PUBLIC_IP}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://${PUBLIC_IP}/api/v1
      - VITE_COGNITO_DOMAIN=${VITE_COGNITO_DOMAIN}
      - VITE_COGNITO_CLIENT_ID=${VITE_COGNITO_CLIENT_ID}
      - VITE_COGNITO_REGION=${VITE_COGNITO_REGION}
    depends_on:
      - backend

volumes:
  mongodb_data:
