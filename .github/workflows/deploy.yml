name: Desplegar en EC2

on:
  push:
    branches: [aws]
  pull_request:
    branches: [aws]
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a realizar'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
          - plan

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: classic-library

jobs:
  infrastructure:
    name: Gestionar Infraestructura
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.terraform.outputs.public_ip }}
      instance_id: ${{ steps.terraform.outputs.instance_id }}
      cognito_user_pool_id: ${{ steps.terraform.outputs.cognito_user_pool_id }}
      cognito_app_client_id: ${{ steps.terraform.outputs.cognito_app_client_id }}
      cognito_domain: ${{ steps.terraform.outputs.cognito_domain }}
      api_gateway_url: ${{ steps.terraform.outputs.api_gateway_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derivar clave pública SSH
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret no está configurado"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          if ! ssh-keygen -y -f ~/.ssh/deploy-key.pem > ~/.ssh/deploy-key.pub; then
            echo "::error::SSH key inválida"
            exit 1
          fi
          echo "public_key=$(cat ~/.ssh/deploy-key.pub)" >> $GITHUB_OUTPUT

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Preparar estado de Terraform
        run: |
          BUCKET="classic-library-terraform-state"
          TABLE="classic-library-terraform-locks"

          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" \
              --create-bucket-configuration LocationConstraint="" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET"

          aws dynamodb describe-table --table-name "$TABLE" 2>/dev/null || \
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST

          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Inicializar Terraform
        working-directory: infra
        run: terraform init

      - name: Importar recursos existentes
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
        working-directory: infra
        run: |
          KEY_ID=$(aws ec2 describe-key-pairs \
            --filters "Name=key-name,Values=${{ env.PROJECT_NAME }}-key" \
            --query "KeyPairs[0].KeyPairId" --output text 2>/dev/null) || true
          if [ -n "$KEY_ID" ] && [ "$KEY_ID" != "None" ]; then
            echo "Importando key pair"
            terraform import aws_key_pair.deployer "${{ env.PROJECT_NAME }}-key" 2>/dev/null || true
          fi

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.PROJECT_NAME }}-sg" \
            --query "SecurityGroups[0].GroupId" --output text 2>/dev/null) || true
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            echo "Importando security group: $SG_ID"
            terraform import aws_security_group.app_sg "$SG_ID" 2>/dev/null || true
          fi

          INST_ID=$(aws ec2 describe-instances \
            --filters "Name=key-name,Values=${{ env.PROJECT_NAME }}-key" \
              "Name=instance-state-name,Values=running,stopped,pending" \
            --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null) || true
          if [ -n "$INST_ID" ] && [ "$INST_ID" != "None" ]; then
            echo "Importando instancia: $INST_ID"
            terraform import aws_instance.app "$INST_ID" 2>/dev/null || true
          fi

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        working-directory: infra
        run: |
          terraform plan \
            -var="ssh_public_key=${{ steps.ssh.outputs.public_key }}" \
            -var="existing_cognito_user_pool_id=${{ secrets.COGNITO_USER_POOL_ID }}" \
            -var="existing_cognito_app_client_id=${{ secrets.COGNITO_APP_CLIENT_ID }}" \
            -var="existing_cognito_domain=${{ secrets.COGNITO_DOMAIN }}"

      - name: Terraform Apply
        id: terraform
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="ssh_public_key=${{ steps.ssh.outputs.public_key }}" \
            -var="existing_cognito_user_pool_id=${{ secrets.COGNITO_USER_POOL_ID }}" \
            -var="existing_cognito_app_client_id=${{ secrets.COGNITO_APP_CLIENT_ID }}" \
            -var="existing_cognito_domain=${{ secrets.COGNITO_DOMAIN }}"
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_app_client_id=$(terraform output -raw cognito_app_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(terraform output -raw cognito_domain)" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: infra
        run: |
          terraform destroy -auto-approve \
            -var="ssh_public_key=${{ steps.ssh.outputs.public_key }}" \
            -var="existing_cognito_user_pool_id=${{ secrets.COGNITO_USER_POOL_ID }}" \
            -var="existing_cognito_app_client_id=${{ secrets.COGNITO_APP_CLIENT_ID }}" \
            -var="existing_cognito_domain=${{ secrets.COGNITO_DOMAIN }}"

  deploy:
    name: Desplegar Aplicación
    runs-on: ubuntu-latest
    needs: infrastructure
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar clave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/${{ env.PROJECT_NAME }}-key.pem
          chmod 600 ~/.ssh/${{ env.PROJECT_NAME }}-key.pem

      - name: Esperar que la instancia esté lista
        run: |
          IP="${{ needs.infrastructure.outputs.instance_ip }}"
          echo "Esperando a que SSH esté disponible en $IP..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
              ec2-user@$IP "echo ok" 2>/dev/null; then
              echo "SSH disponible"
              break
            fi
            echo "Intento $i/30..."
            sleep 5
          done

      - name: Crear directorio /app
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }} \
            "sudo mkdir -p /app && sudo chown -R ec2-user:ec2-user /app"

      - name: Copiar archivos a EC2
        run: |
          scp -o StrictHostKeyChecking=no -r \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            docker-compose.prod.yml backend/ frontend/ \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }}:/app/

      - name: Configurar entorno remoto
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }} \
            "cd /app && printf '%s\n' \
              'MONGO_URI=mongodb://admin:${{ secrets.MONGO_PASSWORD }}@mongodb:27017/classic_library?authSource=admin' \
              'MONGO_DATABASE=classic_library' \
              'MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}' \
              'PUBLIC_IP=${{ needs.infrastructure.outputs.instance_ip }}' \
              'COGNITO_REGION=${{ env.AWS_REGION }}' \
              'COGNITO_USER_POOL_ID=${{ needs.infrastructure.outputs.cognito_user_pool_id }}' \
              'COGNITO_APP_CLIENT_ID=${{ needs.infrastructure.outputs.cognito_app_client_id }}' \
              'VITE_API_URL=http://${{ needs.infrastructure.outputs.instance_ip }}/api/v1' \
              'VITE_COGNITO_DOMAIN=${{ needs.infrastructure.outputs.cognito_domain }}' \
              'VITE_COGNITO_CLIENT_ID=${{ needs.infrastructure.outputs.cognito_app_client_id }}' \
              'VITE_COGNITO_REDIRECT_URI=${{ secrets.CLOUDFRONT_DOMAIN }}/callback' \
              'VITE_COGNITO_REGION=${{ env.AWS_REGION }}' \
              > .env"

      - name: Desplegar con Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }} \
            "cd /app && \
             docker compose -f docker-compose.prod.yml down && \
             docker compose -f docker-compose.prod.yml up -d --build"

      - name: Verificación de salud
        run: |
          IP="${{ needs.infrastructure.outputs.instance_ip }}"
          echo "Esperando a que los servicios inicien..."
          for i in $(seq 1 12); do
            sleep 10
            RESPONSE=$(curl -sf "http://$IP/api/v1/health" 2>/dev/null) && {
              echo "Health check: $RESPONSE"
              echo "$RESPONSE" | grep -q '"mock_db":false' && {
                echo "MongoDB conectado"
                exit 0
              }
              echo "MongoDB no conectado, reintentando..."
            }
            echo "Intento $i/12..."
          done
          echo "Health check falló después de 12 intentos"
          exit 1

      - name: Mostrar información del despliegue
        run: |
          echo "=========================================="
          echo "¡Despliegue completado!"
          echo "=========================================="
          echo "URL de la app: http://${{ needs.infrastructure.outputs.instance_ip }}"
          echo "URL de la API: http://${{ needs.infrastructure.outputs.instance_ip }}/api/v1"
          echo "API Gateway:  ${{ needs.infrastructure.outputs.api_gateway_url }}"
          echo "Cognito:     ${{ needs.infrastructure.outputs.cognito_domain }}"
          echo "=========================================="
