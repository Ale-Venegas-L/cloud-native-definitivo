name: Deploy to EC2

on:
  push:
    branches: [aws]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
          - plan

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: classic-library

jobs:
  infrastructure:
    name: Manage Infrastructure
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.terraform.outputs.public_ip }}
      instance_id: ${{ steps.terraform.outputs.instance_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra
        run: |
          terraform plan \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        if: github.event.inputs.action != 'destroy'
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Terraform Output
        id: terraform
        working-directory: infra
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: infra
        run: terraform destroy -auto-approve \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.event.inputs.action != 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/${{ env.PROJECT_NAME }}-key.pem
          chmod 600 ~/.ssh/${{ env.PROJECT_NAME }}-key.pem

      - name: Wait for instance ready
        run: |
          echo "Waiting for instance and user_data to complete..."
          sleep 45

      - name: Copy files to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            docker-compose.prod.yml backend/ frontend/ \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }}:/app/

      - name: Setup remote environment
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }} << ENVEOF
            cd /app
            cat > .env << EOF
            MONGO_URI=mongodb://admin:password@mongodb:27017/classic_library?authSource=admin
            MONGO_DATABASE=classic_library
            PUBLIC_IP=${{ needs.infrastructure.outputs.instance_ip }}
            VITE_API_URL=http://${{ needs.infrastructure.outputs.instance_ip }}/api/v1
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            EOF
          ENVEOF

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/${{ env.PROJECT_NAME }}-key.pem \
            ec2-user@${{ needs.infrastructure.outputs.instance_ip }} << 'DEPLOYEOF'
            cd /app
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
          DEPLOYEOF

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -sf http://${{ needs.infrastructure.outputs.instance_ip }}/api/v1/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/6 failed, retrying..."
          done
          echo "Health check failed after 6 attempts"
          exit 1

      - name: Print deployment info
        run: |
          echo "=========================================="
          echo "Deployment complete!"
          echo "=========================================="
          echo "App URL: http://${{ needs.infrastructure.outputs.instance_ip }}"
          echo "API URL: http://${{ needs.infrastructure.outputs.instance_ip }}/api/v1"
          echo "=========================================="
